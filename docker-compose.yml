services:
  whatsapp-claude-bot:
    # Imagen ya compilada por GitHub Actions (ver .github/workflows/docker-publish.yml).
    # El VPS solo descarga esto - nunca compila nada aqui.
    # Reemplaza <TU_USUARIO>/<TU_REPO> por los tuyos (todo en minusculas).
    image: ghcr.io/marioespino81-boop/whatsisso-claudebot:latest
    container_name: whatsapp-claude-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent WhatsApp session (linked device auth) + message DB + bridge token.
      # Without this volume you'd have to re-scan the pairing code on every deploy.
      - whatsapp_store:/app/bridge/store
      # Prompt de negocio (texto largo con formato) - se lee en vez de SYSTEM_PROMPT.
      # El archivo system-prompt.md debe existir junto a este docker-compose.yml.
      - ./system-prompt.md:/app/config/system-prompt.md:ro
    # Solo se publica el puerto 8790 (webhook de WooCommerce) - es el UNICO
    # que debe ser alcanzable desde internet. El bridge (8080) y el webhook
    # de WhatsApp (8769) siguen siendo solo-localhost dentro del contenedor.
    ports:
      - "8790:8790"
    # Descomenta solo si necesitas pegarle a la API REST del bridge desde
    # fuera del contenedor para depurar (normalmente NO hace falta):
    # ports:
    #   - "8080:8080"

  # Segunda instancia: mismo bot, numero exclusivo de Lista Morada.
  # Usa la misma imagen y el mismo .env (comparte ANTHROPIC_API_KEY, OWNER_CHAT_JID, etc.)
  # pero con su propia sesion de WhatsApp (volumen separado) y su propio prompt.
  whatsapp-claude-bot-morada:
    image: ghcr.io/marioespino81-boop/whatsisso-claudebot:latest
    container_name: whatsapp-claude-bot-morada
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - whatsapp_store_morada:/app/bridge/store
      - ./system-prompt-morada.md:/app/config/system-prompt.md:ro
    # Sin webhook de WooCommerce en este numero por ahora (no se publica ningun
    # puerto). Si mas adelante se necesita, mapear a un puerto distinto al 8790,
    # por ejemplo "8791:8790", para no chocar con la instancia principal.

volumes:
  whatsapp_store:
  whatsapp_store_morada:
